{% extends "base.html" %}

{% block title %}
Login · Encrypted Diary
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            🔐
        </div>

        <div class="eyebrow">
            PRIVATE JOURNAL
        </div>

        <h1>
            Welcome back
        </h1>

        <p class="auth-description">
            Sign in to access your encrypted diaries.
        </p>


        <form method="POST">

            <div class="field">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Account Password
                </label>

                <div class="password-field">

                    <input
                        type="password"
                        name="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword(
                            'loginPassword',
                            this
                        )"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Sign In
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <p class="auth-switch">

            Don't have an account?

            <a
                href="{{ url_for('register') }}"
            >
                Create one
            </a>

        </p>


        <div class="auth-security">

            <span>✓</span>

            Your diaries are protected
            by individual encryption passwords.

        </div>

    </div>

</div>

{% endblock %}
